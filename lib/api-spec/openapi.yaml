openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: BioMinute Publishing Dashboard API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: episodes
    description: Episode management
  - name: youtube
    description: YouTube publishing operations
  - name: facebook
    description: Facebook publishing operations
  - name: analytics
    description: Social analytics operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /episodes:
    get:
      operationId: listEpisodes
      tags: [episodes]
      summary: List all episodes
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, scripted, complete, scheduled, published, building]
        - name: season
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of episodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Episode"
    post:
      operationId: createEpisode
      tags: [episodes]
      summary: Create a new episode (enters building pipeline)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEpisodeBody"
      responses:
        "201":
          description: Created episode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Episode"

  /episodes/stats:
    get:
      operationId: getEpisodeStats
      tags: [episodes]
      summary: Get episode stats summary
      responses:
        "200":
          description: Stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EpisodeStats"

  /episodes/sync-workbook:
    post:
      operationId: syncWorkbook
      tags: [episodes]
      summary: Re-seed episode metadata from the newest workbook
      responses:
        "200":
          description: Workbook sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncWorkbookResult"

  /episodes/social-rows:
    get:
      operationId: getEpisodeSocialRows
      tags: [episodes]
      summary: Get per-episode asset and social publishing status
      parameters:
        - name: episodes
          in: query
          required: false
          description: Comma-separated episode numbers to return
          schema:
            type: string
      responses:
        "200":
          description: Social status rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialRowsResult"

  /episodes/upcoming:
    get:
      operationId: getUpcomingEpisodes
      tags: [episodes]
      summary: Get next 5 episodes due to publish
      responses:
        "200":
          description: Upcoming episodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Episode"

  /episodes/{id}:
    get:
      operationId: getEpisode
      tags: [episodes]
      summary: Get a single episode
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Episode detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Episode"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateEpisode
      tags: [episodes]
      summary: Update episode status or metadata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EpisodeUpdate"
      responses:
        "200":
          description: Updated episode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Episode"

  /episodes/{id}/build-status:
    get:
      operationId: getBuildStatus
      tags: [episodes]
      summary: Get build status for an episode
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Build status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildStatus"

  /episodes/{id}/render-status:
    get:
      operationId: getRenderStatus
      tags: [episodes]
      summary: Get durable render process status for an episode
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Render process status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderStatus"
        "404":
          description: Episode not found

  /episodes/{id}/run-production:
    post:
      operationId: runProduction
      tags: [episodes]
      summary: Trigger production render for an episode
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Production started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunProductionResult"
        "409":
          description: A render is already running for this episode

  /episodes/{id}/video:
    get:
      operationId: getEpisodeVideo
      tags: [episodes]
      summary: Stream the rendered episode MP4
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rendered MP4
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "404":
          description: Episode or rendered video not found

  /youtube/auth-url:
    get:
      operationId: getYouTubeAuthUrl
      tags: [youtube]
      summary: Get OAuth URL to connect YouTube account
      responses:
        "200":
          description: Auth URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YouTubeAuthUrl"

  /youtube/status:
    get:
      operationId: getYouTubeStatus
      tags: [youtube]
      summary: Check if YouTube account is connected
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YouTubeStatus"

  /youtube/publish/{id}:
    post:
      operationId: publishToYouTube
      tags: [youtube]
      summary: Schedule or publish episode to YouTube
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishRequest"
      responses:
        "200":
          description: Publish result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /youtube/repair/{id}:
    post:
      operationId: repairYouTubeVideo
      tags: [youtube]
      summary: Repair YouTube metadata for an existing video
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Repair result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"

  /facebook/status:
    get:
      operationId: getFacebookStatus
      tags: [facebook]
      summary: Check Facebook publishing configuration
      responses:
        "200":
          description: Facebook connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacebookStatus"

  /facebook/publish/{id}:
    post:
      operationId: publishToFacebook
      tags: [facebook]
      summary: Publish an episode to Facebook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Facebook publish result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericSuccess"

  /analytics/youtube/{id}:
    get:
      operationId: getYouTubeAnalytics
      tags: [analytics]
      summary: Fetch live YouTube analytics for an episode
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: YouTube analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsResult"

  /analytics/facebook/{id}:
    get:
      operationId: getFacebookAnalytics
      tags: [analytics]
      summary: Fetch live Facebook analytics for an episode
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Facebook analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsResult"

  /analytics/episodes:
    get:
      operationId: getEpisodesAnalytics
      tags: [analytics]
      summary: Get aggregate analytics for published episodes
      responses:
        "200":
          description: Aggregate analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsAggregate"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    Episode:
      type: object
      properties:
        id:
          type: integer
        epNumber:
          type: integer
        status:
          type: string
          enum: [draft, scripted, complete, scheduled, published, building]
        dateBuilt:
          type: ["string", "null"]
        postDate:
          type: string
          format: date-time
          nullable: true
        season:
          type: string
        aspectRatio:
          type: string
        duration:
          type: string
        hookTitle:
          type: string
        youtubeTitle:
          type: string
        voScript:
          type: string
        visualDirection:
          type: string
        bgSound:
          type: string
        thumbnailPrompt:
          type: string
        citationCta:
          type: string
        hashtags:
          type: string
        youtubeVideoId:
          type: ["string", "null"]
        facebookVideoId:
          type: ["string", "null"]
        youtubeViews:
          type: ["integer", "null"]
        youtubeLikes:
          type: ["integer", "null"]
        youtubeComments:
          type: ["integer", "null"]
        facebookViews:
          type: ["integer", "null"]
        facebookLikes:
          type: ["integer", "null"]
        facebookComments:
          type: ["integer", "null"]
        facebookShares:
          type: ["integer", "null"]
        buildStage:
          type: ["string", "null"]
        buildNote:
          type: ["string", "null"]
        scheduledPublishAt:
          type: ["string", "null"]
        approvedAt:
          type: ["string", "null"]
        publishedAt:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - epNumber
        - status
        - postDate
        - season
        - duration
        - hookTitle
        - youtubeTitle
        - voScript
        - visualDirection
        - bgSound
        - thumbnailPrompt
        - citationCta
        - hashtags
        - createdAt
        - updatedAt

    EpisodeUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [draft, scripted, complete, scheduled, published, building]
        youtubeTitle:
          type: string
        citationCta:
          type: string
        hashtags:
          type: string
        buildStage:
          type: ["string", "null"]
        buildNote:
          type: ["string", "null"]
        scheduledPublishAt:
          type: string

    EpisodeStats:
      type: object
      properties:
        total:
          type: integer
        byStatus:
          type: object
          properties:
            draft:
              type: integer
            scripted:
              type: integer
            complete:
              type: integer
            scheduled:
              type: integer
            published:
              type: integer
            building:
              type: integer
          required: [draft, scripted, complete, scheduled, published, building]
        nextPostDate:
          type: ["string", "null"]
        publishedThisMonth:
          type: integer
      required: [total, byStatus, publishedThisMonth]

    YouTubeAuthUrl:
      type: object
      properties:
        url:
          type: string
      required: [url]

    YouTubeStatus:
      type: object
      properties:
        connected:
          type: boolean
        channelName:
          type: ["string", "null"]
        channelId:
          type: ["string", "null"]
      required: [connected]

    PublishRequest:
      type: object
      properties:
        scheduleAt:
          type: ["string", "null"]
          description: ISO datetime to schedule. Null = publish immediately.
        privacyStatus:
          type: string
          enum: [public, unlisted, private]
          default: public
      required: [privacyStatus]

    PublishResult:
      type: object
      properties:
        success:
          type: boolean
        youtubeVideoId:
          type: ["string", "null"]
        youtubeUrl:
          type: ["string", "null"]
        scheduledAt:
          type: ["string", "null"]
        message:
          type: string
      required: [success, message]


    CreateEpisodeBody:
      type: object
      properties:
        epNumber:
          type: integer
        postDate:
          type: string
          format: date-time
          nullable: true
        season:
          type: string
        duration:
          type: string
          default: "60s"
        hookTitle:
          type: string
        youtubeTitle:
          type: string
        voScript:
          type: string
        visualDirection:
          type: string
        bgSound:
          type: string
          default: "calm ambient"
        thumbnailPrompt:
          type: string
        citationCta:
          type: string
        hashtags:
          type: string
        aspectRatio:
          type: string
          default: "9:16"
      required:
        - epNumber
        - postDate
        - season
        - hookTitle
        - youtubeTitle
        - voScript
        - visualDirection
        - thumbnailPrompt
        - citationCta
        - hashtags

    BuildStatus:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
        buildStage:
          type: ["string", "null"]
        buildNote:
          type: ["string", "null"]
        videoExists:
          type: boolean
        videoPath:
          type: ["string", "null"]
      required:
        - id
        - status
        - videoExists

    RunProductionResult:
      type: object
      properties:
        success:
          type: boolean
        jobId:
          type: integer
        pid:
          type: integer
        message:
          type: string
      required: [success, jobId, pid, message]

    RenderStatus:
      type: object
      properties:
        status:
          type: string
          enum: [idle, running, succeeded, failed]
        jobId:
          type: ["integer", "null"]
        pid:
          type: ["integer", "null"]
        startedAt:
          type: ["string", "null"]
          format: date-time
        finishedAt:
          type: ["string", "null"]
          format: date-time
        logPath:
          type: ["string", "null"]
        error:
          type: ["string", "null"]
      required: [status, jobId, pid, startedAt, finishedAt, logPath, error]

    SyncWorkbookResult:
      type: object
      properties:
        success:
          type: boolean
        inserted:
          type: integer
        updated:
          type: integer
        raw:
          type: string
      required: [success, inserted, updated]

    SocialRow:
      type: object
      properties:
        epNumber:
          type: integer
        hookTitle:
          type: string
        status:
          type: string
        hasFolder:
          type: boolean
        hasVideoFile:
          type: boolean
        youtubeVideoId:
          type: ["string", "null"]
        facebookVideoId:
          type: ["string", "null"]
        postDate:
          type: ["string", "null"]
          format: date-time
        scheduledPublishAt:
          type: ["string", "null"]
          format: date-time
      required: [epNumber, hookTitle, status, hasFolder, hasVideoFile]

    SocialRowsResult:
      type: object
      properties:
        total:
          type: integer
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SocialRow"
      required: [total, rows]

    FacebookStatus:
      type: object
      properties:
        connected:
          type: boolean
        pageId:
          type: ["string", "null"]
        hasAccessToken:
          type: boolean
        hasPageId:
          type: boolean
      required: [connected, hasAccessToken, hasPageId]

    AnalyticsResult:
      type: object
      additionalProperties: true

    AnalyticsAggregate:
      type: object
      additionalProperties: true

    GenericSuccess:
      type: object
      additionalProperties: true

    # REMOVED: RejectEpisodeBody, RejectEpisodeResponse — manual rejection workflow eliminated
